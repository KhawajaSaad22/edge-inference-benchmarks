name: Benchmark and Linux container
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: docker build --target base -t edge-benchmarks .
      - run: docker run --rm edge-benchmarks --output /tmp/demo --size 128 --repeats 5 --warmup 1
